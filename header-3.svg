<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Can Bayır — .NET Core developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070a"/><stop offset=".55" stop-color="#06110f"/><stop offset="1" stop-color="#0a1b17"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c572"/><stop offset=".45" stop-color="#5fcbb0"/><stop offset=".85" stop-color="#2c7f6f"/><stop offset="1" stop-color="#215c51"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0"/><stop offset="1" stop-color="#0a0a0a" stop-opacity=".9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="24"/></clipPath>
    <clipPath id="pill"><rect width="436" height="76" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- kuzey ışığı perdeleri -->
    <g filter="url(#blur)" opacity=".95">
      <ellipse cx="380" cy="120" rx="330" ry="95" fill="#5fcbb0" opacity=".55">
        <animateTransform attributeName="transform" type="translate" values="-40 0; 40 -14; -40 0" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="820" cy="85" rx="300" ry="80" fill="#93c572" opacity=".42">
        <animateTransform attributeName="transform" type="translate" values="30 0; -30 12; 30 0" dur="19s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="600" cy="180" rx="380" ry="70" fill="#2c7f6f" opacity=".55">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -18; 0 0" dur="13s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1020" cy="170" rx="200" ry="60" fill="#5fcbb0" opacity=".3">
        <animateTransform attributeName="transform" type="translate" values="0 0; -24 10; 0 0" dur="17s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g filter="url(#blur2)" opacity=".5">
      <rect x="-200" y="-80" width="1600" height="520" fill="none"/>
      <path d="M-100 30 L1300 150" stroke="#93c572" stroke-width="22" opacity=".18">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 30; 0 0" dur="12s" repeatCount="indefinite"/>
      </path>
      <path d="M-100 110 L1300 230" stroke="#5fcbb0" stroke-width="14" opacity=".14">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -26; 0 0" dur="15s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- yıldızlar -->
    <g fill="#fff">
      <circle cx="140" cy="46" r="1.2" opacity=".8"><animate attributeName="opacity" values=".8;.2;.8" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="396" cy="28" r="1" opacity=".6"/>
      <circle cx="690" cy="52" r="1.4" opacity=".7"><animate attributeName="opacity" values=".7;.15;.7" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="24" r="1" opacity=".5"/>
      <circle cx="1060" cy="70" r="1.3" opacity=".7"><animate attributeName="opacity" values=".7;.2;.7" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="96" r="1" opacity=".45"/>
      <circle cx="240" cy="118" r="1" opacity=".5"/>
      <circle cx="1150" cy="130" r="1" opacity=".4"/>
      <circle cx="790" cy="140" r="1.2" opacity=".5"><animate attributeName="opacity" values=".5;.1;.5" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- devre izleri -->
    <g fill="none" stroke="#93c572" stroke-opacity=".12" stroke-width="1">
      <path id="tr1" d="M-20 300 H180 V250 H330 V290 H520"/>
      <path id="tr2" d="M1220 90 H1040 V150 H900 V120 H760"/>
      <path id="tr3" d="M700 400 V330 H860 V300 H1010"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-width="1.8">
      <path d="M0 0 h26" stroke="#93c572" opacity=".9"><animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#tr1"/></animateMotion></path>
      <path d="M0 0 h26" stroke="#5fcbb0" opacity=".9"><animateMotion dur="6.5s" begin="1.5s" repeatCount="indefinite" rotate="auto"><mpath href="#tr2"/></animateMotion></path>
      <path d="M0 0 h26" stroke="#93c572" opacity=".9"><animateMotion dur="4.5s" begin="3s" repeatCount="indefinite" rotate="auto"><mpath href="#tr3"/></animateMotion></path>
    </g>

    <!-- dağ silueti -->
    <path d="M0 380 V300 L70 262 L140 292 L230 226 L300 268 L380 246 L450 288 L540 214 L610 258 L690 236 L770 280 L850 222 L940 262 L1030 236 L1110 274 L1200 244 V380 Z" fill="#050807"/>
    <path d="M0 380 V330 L110 300 L220 326 L340 292 L470 320 L600 286 L740 318 L880 290 L1010 322 L1120 300 L1200 316 V380 Z" fill="#030504"/>
    <rect y="200" width="1200" height="180" fill="url(#fade)"/>

    <!-- metin -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="132" font-size="15" font-weight="500" letter-spacing="3.2" fill="#8fbfa8">CAN BAYIR</text>
      <text x="72" y="206" font-size="64" font-weight="600" letter-spacing="-2.5" fill="#f2f2f2">Design &amp; web</text>
      <g transform="translate(72 226)">
        <rect width="436" height="76" rx="12" fill="url(#wave)"/>
        <rect width="436" height="76" rx="12" fill="url(#wave)" opacity=".35">
          <animate attributeName="opacity" values=".35;.05;.35" dur="6s" repeatCount="indefinite"/>
        </rect>
        <g opacity=".22" stroke="#0a0a0a" stroke-width="10" clip-path="url(#pill)">
          <path d="M-30 90 L120 -14"/><path d="M60 90 L210 -14"/><path d="M150 90 L300 -14"/><path d="M240 90 L390 -14"/><path d="M330 90 L480 -14"/>
          <animateTransform attributeName="transform" type="translate" values="0 0; 90 0; 0 0" dur="9s" repeatCount="indefinite"/>
        </g>
        <text x="16" y="58" font-size="64" font-weight="600" letter-spacing="-2.5" fill="#0a0a0a">development</text>
      </g>
      <text x="520" y="284" font-size="64" font-weight="600" letter-spacing="-2.5" fill="#f2f2f2">that ships.</text>
      <text x="72" y="344" font-size="17" fill="#9fb3aa">Full-stack developer from Türkiye — .NET Core · ASP.NET MVC · React · Next.js · Node · Tailwind · MSSQL</text>
    </g>

  </g>
</svg>
